apiVersion: apps/v1
kind: Deployment
metadata:
  name: "llm"
  labels:
    ai-services.io/component: {{ .Release.Name }}
    ai-services.io/template: {{ .Chart.Name }}
    ai-services.io/version: {{ default .Chart.AppVersion | quote }}
spec:
  replicas: 1
  selector:
    matchLabels:
      ai-services.io/component: {{ .Release.Name }}
      ai-services.io/name: llm
  template:
    metadata:
      labels:
        ai-services.io/component: {{ .Release.Name }}
        ai-services.io/template: {{ .Chart.Name }}
        ai-services.io/name: llm
        ai-services.io/version: {{ default .Chart.AppVersion | quote }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: litellm
          image: "{{ .Values.llm.image }}"
          command:
            - litellm
            - --config
            - /app/config.yaml
            - --port
            - "8000"
            - --debug
          envFrom:
            - secretRef:
                name: "watsonx-credentials"
          env:
            - name: WATSONX_PROJECT_ID
              value: "{{ .Values.llm.watsonxProjectId }}"
            - name: WATSONX_URL
              value: "{{ .Values.llm.watsonxUrl }}"
            - name: LLM_MODEL
              value: "watsonx/{{ .Values.llm.model }}"
            - name: LLM_MODEL_NAME
              value: "{{ .Values.llm.model }}"
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: {{ .Values.llm.resources.requests.cpu | quote }}
              memory: {{ .Values.llm.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.llm.resources.limits.cpu | quote }}
              memory: {{ .Values.llm.resources.limits.memory | quote }}
          ports:
            - containerPort: 8000
              protocol: TCP
